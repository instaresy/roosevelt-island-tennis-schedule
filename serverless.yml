# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: dpark068
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: roosevelt-island-tennis-scheduler
# "service" is the name of this project. This will also be added to your AWS resource names.
service: tennis-scheduler

provider:
  name: aws
  runtime: python3.10
  region: us-east-1  # Change the region if necessary
  environment:  # Global environment variables (optional)
    ENVIRONMENT: ${env:STAGE}
    RIOC_URL: ${env:RIOC_URL}
    USERNAME_1: ${env:USERNAME_1}
    PW_1: ${env:PW_1}
    USERNAME_2: ${env:USERNAME_2}
    PW_2: ${env:PW_2}
    USERNAME_3: ${env:USERNAME_3}
    PW_3: ${env:PW_3}
    USERNAME_4: ${env:USERNAME_4}
    PW_4: ${env:PW_4}
    USERNAME_5: ${env:USERNAME_5}
    PW_5: ${env:PW_5}
    USERNAME_6: ${env:USERNAME_6}
    PW_6: ${env:PW_6}
    USERNAME_7: ${env:USERNAME_7}
    PW_7: ${env:PW_7}
    USERNAME_8: ${env:USERNAME_8}
    PW_8: ${env:PW_8}
  # Add IAM permissions for SQS globally to all functions
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - sqs:SendMessage
      Resource:
        - Fn::GetAtt: [PermitQueue, Arn]  # Allow sending messages to the PermitQueue

# Define SQS queue
resources:
  Resources:
    PermitQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: tennis-create-permit-queue
        VisibilityTimeout: 400  # Set visibility timeout to 400 seconds (greater than Lambda's 360s)

functions:
  rateHandler:
    timeout: 240
    handler: handler.run
    events:
      # Run every day at 7:58 AM EST/EDT
      - schedule:
          name: tennisSchedulerDaily
          description: "Run at 7:58 AM EST/EDT every day"
          enabled: true
          rate: cron(58 11 ? * 2-6 *)  # 11:58 UTC is 7:58 AM EST/EDT, only Monday to Friday
    environment:
      PERMIT_QUEUE_URL:
        Ref: PermitQueue
    maximumRetryAttempts: 0  # Disable retries

  # Process SQS messages and create permits
  permitProcessor:
    handler: permit_processor.process
    timeout: 360
    events:
      - sqs:
          arn:
            Fn::GetAtt: [PermitQueue, Arn]
          batchSize: 2  # Number of messages to process in each invocation
    maximumRetryAttempts: 0

plugins:
  - serverless-python-requirements
